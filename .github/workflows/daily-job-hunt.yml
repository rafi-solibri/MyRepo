name: Daily Job Hunt

on:
  schedule:
    # 09:00 IST = 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-automation/requirements.txt

      - name: Install dependencies
        run: pip install -r job-automation/requirements.txt

      - name: Restore job tracker
        uses: actions/cache@v4
        with:
          path: job-automation/output/jobs.sqlite
          key: job-tracker-${{ github.run_id }}
          restore-keys: |
            job-tracker-

      - name: Run daily job hunt
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python job-automation/src/main.py --root job-automation

      - name: Upload digest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-digest
          path: |
            job-automation/output/digest-*.md
            job-automation/output/digest-*.json
            job-automation/output/applications/**
          if-no-files-found: warn

      - name: Commit tracker + latest digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p job-automation/output
          git add job-automation/output/jobs.sqlite job-automation/output/digest-*.md job-automation/output/digest-*.json || true
          if git diff --staged --quiet; then
            echo "No tracker/digest changes to commit"
          else
            git commit -m "chore: daily job hunt digest $(date -u +%F)"
            git push
          fi
