# Mid-morning recovery when 9 AM portal crons miss (10:30 AM IST = 05:00 UTC).
# Prefer also creating the Cursor Automation "Ensure Missing Daily Runs"
# (automation-prompts/09-ensure-missing.md) — agents cannot create Automations via API.
# This workflow is the durable backup: launches missing portals as fresh cloud jobs.
name: Ensure Missing Daily Runs

on:
  schedule:
    # 10:30 AM IST (Asia/Kolkata has no DST)
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  ensure-missing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Launch missing same-day portal cloud jobs
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [[ -z "${CURSOR_API_KEY}" ]]; then
            echo "Set repository secret CURSOR_API_KEY (https://cursor.com/dashboard/api)."
            exit 1
          fi
          bash scripts/ensure-missing-daily-runs.sh
